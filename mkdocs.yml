site_name: Bluz Developer Documentation
site_description: Internal developer documentation for the Bluz scheduling & curriculum-management platform.
site_url: https://system-b15.github.io/bluz/
repo_url: https://github.com/system-b15/bluz
repo_name: system-b15/bluz
copyright: Copyright &copy; 2026 System B15

theme:
  name: material
  direction: rtl
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - typedoc:
      source: ./ui/src
      tsconfig: ./ui/tsconfig.json
      output_dir: api
      typedoc_options:
        entryPointStrategy: expand
        exclude:
          - "**/node_modules/**"
          - "**/.next/**"
          - "**/components/**"
          - "**/app/!(api)/**"
  - mkdocs-typer2:
      pretty: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_mermaid
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - API Reference: api/
  - CLI Reference: cli/index.md
