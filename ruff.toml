# Org-wide baseline (System-B90): keep the shared section identical in every repo.
# Rules = ruff's default set for the pinned version + I, W, B, UP. The ruff pin
# (requirements / pyproject `lint` extra / CI) is what keeps the default set stable;
# bump it deliberately and fix what the new version flags in the same change.
line-length = 88
extend-exclude = [".agents", ".agent"]

[lint]
extend-select = ["I", "W", "B", "UP"]

[lint.flake8-bugbear]
# Typer declares CLI parameters as `param: T = typer.Option(...)`. The call is
# evaluated once at import and only read by Typer, so B008's
# mutable-default concern does not apply.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[lint.per-file-ignores]
# Best-effort demo seeding against a live Hive: every create/delete logs its
# failure and moves on to the next item, so one bad record never aborts a run.
"scripts/demo/populate_demo_hive.py" = ["BLE001"]

[format]
# Docs embed `--8<--` snippet includes and aligned trailing comments in python
# fences; the markdown formatter would corrupt both.
exclude = ["*.md"]
