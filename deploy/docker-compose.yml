name: bluz

services:
    ui:
        image: ghcr.io/system-b90/bluz/ui:${BLUZ_VERSION:-latest}
        build:
            context: ./../
            dockerfile: ui/Dockerfile
            args:
                NPM_TOKEN: ${NPM_TOKEN}
        container_name: bluz-ui
        restart: unless-stopped
        env_file:
            - ../.env
        networks:
            - bluz_net
            - hive_net
        depends_on:
            curriculum-db:
                condition: service_healthy
            mongodb:
                condition: service_healthy
            sessions:
                condition: service_started
        healthcheck:
            # No curl/wget in the distroless-ish runner image; node is the only
            # HTTP client available. 503 (a dependency is down) exits non-zero.
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    curriculum-db:
        image: postgres:15-alpine
        container_name: bluz-curriculum-db
        restart: always
        env_file:
            - ../.env
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - bluz_net
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    mongodb:
        image: mongodb/mongodb-community-server:8.0-ubuntu2204
        container_name: bluz-mongodb
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
        volumes:
            - mongodb_data:/data/db
        networks:
            - bluz_net
        healthcheck:
            test:
                [
                    "CMD",
                    "mongosh",
                    "--eval",
                    "db.adminCommand('ping')",
                    "--quiet",
                ]
            interval: 10s
            timeout: 10s
            retries: 5
            start_period: 20s

    sessions:
        image: ghcr.io/system-b90/bluz/sessions:${BLUZ_VERSION:-latest}
        build:
            context: ../session-server
            dockerfile: Dockerfile.websocket
            args:
                NPM_TOKEN: ${NPM_TOKEN}
        container_name: bluz-sessions
        restart: unless-stopped
        env_file:
            - ../.env
        networks:
            - bluz_net
        healthcheck:
            # Pure WebSocket server — no HTTP route to probe, so accepting a TCP
            # connection on the listen port is the readiness signal.
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "require('net').connect(28199,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

    proxy:
        image: ghcr.io/system-b90/bluz/proxy:${BLUZ_VERSION:-latest}
        container_name: bluz-proxy
        restart: unless-stopped
        build:
            context: ./../nginx
            dockerfile: Dockerfile.proxy
        ports:
            - "127.0.0.3:80:80"
            - "127.0.0.3:443:443"
        volumes:
            - ./../nginx/ssl:/etc/nginx/ssl:ro
        depends_on:
            - ui
            - sessions
        networks:
            - bluz_net
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "hive.org:host-gateway"
volumes:
    pgdata:
    mongodb_data:

networks:
    bluz_net:
        driver: bridge
    hive_net:
        # The Hive stack's network, which hive-nginx aliases "hive.org" onto
        # (see pyhive/hive-stack/docker-compose.yaml). Compose derives the name
        # from the directory Hive was brought up in, so it differs by
        # environment: locally that is hive-stack/, while CI checks Hive out to
        # hive/ and gets hive_hive-net. The default keeps the local flow
        # working with no configuration; CI sets HIVE_NETWORK_NAME.
        name: ${HIVE_NETWORK_NAME:-hive-stack_hive-net}
        external: true
