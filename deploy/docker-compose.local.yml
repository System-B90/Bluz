name: bluz

services:
    proxy:
        image: ghcr.io/system-b90/bluz/proxy:${BLUZ_VERSION:-latest}
        container_name: bluz-proxy-local
        restart: unless-stopped
        build:
            context: ./../nginx
            dockerfile: Dockerfile.proxy
        ports:
            - "127.0.0.3:80:80"
            - "127.0.0.3:443:443"
        volumes:
            - ./../nginx/ssl:/etc/nginx/ssl:ro
            - ./../nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
        networks:
            - bluz_net
        extra_hosts:
            - "host.docker.internal:host-gateway"
            # nginx.local.conf's websocket upstream is the bare hostname
            # "mks-srvu" (no ".lan"). Windows resolves that via its DNS suffix
            # search list, which containers don't inherit, so nginx fails to
            # start with "host not found in upstream" unless it's pinned here.
            # IP drifts on DHCP — see mks-srvu.lan in the Windows hosts file
            # for the current one if this ever goes stale again.
            - "mks-srvu:10.0.0.244"

networks:
    bluz_net:
        driver: bridge
