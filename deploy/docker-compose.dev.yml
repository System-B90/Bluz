name: bluz

services:
    ui:
        # Own tag: the base file names ui ghcr.io/.../ui:latest, and building the
        # dev target under that name makes later non-build runs of other stacks
        # boot the dev image (npm run dev, then a "docker: not found" loop).
        image: bluz-ui:dev
        build:
            target: dev
        command: npm run next:dev
        environment:
            - NODE_ENV=development
        develop:
            watch:
                - action: sync
                  path: ../
                  target: /app/
                  ignore:
                      - node_modules/
                      - .next/
                      - ui/.next/
                - action: rebuild
                  path: package.json
                - action: rebuild
                  path: package-lock.json

    proxy:
        ports: !override
            - "127.0.0.3:80:80"
            - "127.0.0.3:443:443"
        volumes:
            - ../nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

    curriculum-db:
        ports:
            - "127.0.0.3:5432:5432"

    mongodb:
        ports:
            - "127.0.0.3:27018:27017"
