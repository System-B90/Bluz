# Docker Compose override for E2E testing.
# Orchestrates dedicated containers so tests don't pollute the dev databases.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#   npx playwright test
#   docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

services:
    ui:
        build:
            context: ./../
            dockerfile: ui/Dockerfile
            target: runner
        container_name: ${TEST_PROJECT_NAME}-ui
        # Resolve hive.org to the host, where the local Hive instance publishes
        # its proxy. Override HIVE_HOST_IP if Hive runs elsewhere.
        extra_hosts:
            - "hive.org:${HIVE_HOST_IP:-host-gateway}"
        environment:
            - NODE_ENV=production
            - MONGO_CONNECTION_STRING=mongodb://mongo_admin:4Cqoz8M7g1oYHxaOuCBsOSi7KeOvWWRP@mongodb:27017/
            - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${TEST_PROJECT_NAME}-curriculum-db:5432/${POSTGRES_DB}
            - NEXTAUTH_URL=https://127.0.0.3:${TEST_PROXY_PORT_HTTPS}
            - HIVE_CLIENT_ID=${TEST_HIVE_CLIENT_ID}
            - HIVE_CLIENT_SECRET=${TEST_HIVE_CLIENT_SECRET}
            - NEXT_PUBLIC_HIVE_URL=${NEXT_PUBLIC_HIVE_URL}
        depends_on:
            - curriculum-db
            - sessions
            - mongodb

    curriculum-db:
        container_name: ${TEST_PROJECT_NAME}-curriculum-db
        ports:
            - "127.0.0.3:${TEST_POSTGRES_PORT}:5432"

    mongodb:
        container_name: ${TEST_PROJECT_NAME}-mongodb
        ports:
            - "127.0.0.3:${TEST_MONGO_PORT}:27017"

    sessions:
        container_name: ${TEST_PROJECT_NAME}-sessions

    proxy:
        container_name: ${TEST_PROJECT_NAME}-proxy
        ports: !override
            - "127.0.0.3:${TEST_PROXY_PORT_HTTP}:80"
            - "127.0.0.3:${TEST_PROXY_PORT_HTTPS}:443"
        volumes: !override
            - ./../nginx/nginx.conf.test:/etc/nginx/nginx.conf:ro
            - ./../nginx/ssl:/etc/nginx/ssl:ro
