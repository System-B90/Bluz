# Docker Compose override for E2E testing.
# Orchestrates dedicated containers so tests don't pollute the dev databases.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#   npx playwright test
#   docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

# A distinct project from the dev stack, and distinct per test run.
#
# This used to say `name: bluz` — the same project as docker-compose.yml — so a
# test stack silently adopted the dev stack's volumes and wrote through
# `bluz_pgdata` / `bluz_mongodb_data`, exactly what this file's header promises
# it does not do. `scripts/run_tests.py` hid the bug by passing `-p` (the CLI
# flag outranks this field); anything invoking compose without it did not.
#
# Volumes, networks and the default container prefix are all project-scoped, so
# a unique name here is the whole isolation mechanism. Parallel stacks need
# nothing but a different TEST_PROJECT_NAME, which run_tests.py derives from the
# worktree slug.
name: ${TEST_PROJECT_NAME:-bluz-test}

services:
    ui:
        build:
            context: ./../
            dockerfile: ui/Dockerfile
            args:
                NPM_TOKEN: ${NPM_TOKEN}
            target: runner
        container_name: ${TEST_PROJECT_NAME:-bluz-test}-ui
        # No hive.org entry here on purpose. Hive's nginx publishes on its own
        # loopback alias (127.0.0.6) so it does not collide with our proxy on
        # 127.0.0.3 — and a host-gateway route cannot reach a loopback-bound
        # port at all. ui joins Hive's network (hive_net in the base compose)
        # and resolves the hive.org container alias over Docker's DNS instead.
        # An extra_hosts line would defeat that: /etc/hosts wins over DNS, so
        # the server-side OAuth call would go to an unreachable address and
        # sign-in would fail with a bare SIGNIN_OAUTH_ERROR (#412).
        environment:
            - NODE_ENV=production
            # directConnection: talk to the one member as-is instead of
            # discovering the set by its advertised host name.
            - MONGO_CONNECTION_STRING=mongodb://mongo_admin:${TEST_MONGO_PASSWORD:-${MONGO_ROOT_PASSWORD}}@mongodb:27017/?directConnection=true
            - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@curriculum-db:5432/${POSTGRES_DB}
            - NEXTAUTH_URL=https://${BLUZ_APP_HOST:-bluz.dev}:${TEST_PROXY_PORT_HTTPS:-8443}
            # The browser opens its WebSocket at the address rendered into the
            # page from these two (ui/src/app/layout.tsx), and it reaches the
            # session server through the proxy's /ws/ location — so it must be
            # the proxy's *published* port, not the in-container 443.
            #
            # Without the port override the client computed `wss://bluz.dev/ws/`
            # (443 collapses the port suffix to empty), and nothing listens
            # there in a test stack: the proxy is published on the dynamic port
            # run_tests.py allocates. Every browser silently failed to connect
            # and retried on a backoff forever, so the entire client-side
            # realtime layer was dead in e2e while the suite stayed green
            # (#636).
            - WEBSOCKET_SESSION_SERVER_HOST=${BLUZ_APP_HOST:-bluz.dev}
            - WEBSOCKET_SESSION_SERVER_PORT=${TEST_PROXY_PORT_HTTPS:-8443}
            - HIVE_CLIENT_ID=${TEST_HIVE_CLIENT_ID}
            - HIVE_CLIENT_SECRET=${TEST_HIVE_CLIENT_SECRET}
            - NEXT_PUBLIC_HIVE_URL=${NEXT_PUBLIC_HIVE_URL}
            # Service account behind the lesson activator (queue-on-live).
            - HIVE_API_USERNAME=${HIVE_API_USERNAME:-api}
            - HIVE_API_PASSWORD=${HIVE_API_PASSWORD:-Password1}
            # Google Calendar against the in-stack stub, never real Google: a
            # throwaway client makes the integration "configured", and the two
            # URLs send its token exchange and Calendar calls to google-stub
            # (#579). Set explicitly so a developer's real .env client never
            # leaks into a test run.
            - GOOGLE_CLIENT_ID=e2e-stub-client.apps.googleusercontent.com
            - GOOGLE_CLIENT_SECRET=e2e-stub-secret
            - GOOGLE_OAUTH_TOKEN_URL=http://google-stub:8080/token
            - GOOGLE_API_ROOT_URL=http://google-stub:8080/
        depends_on:
            - curriculum-db
            - sessions
            - mongodb
            - google-stub

    google-stub:
        image: node:22.20.0-alpine
        container_name: ${TEST_PROJECT_NAME:-bluz-test}-google-stub
        command: ["node", "/stub/server.mjs"]
        volumes:
            - ./../tests/google-stub:/stub:ro
        networks:
            - bluz_net
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
            interval: 5s
            timeout: 5s
            retries: 12

    curriculum-db:
        container_name: ${TEST_PROJECT_NAME:-bluz-test}-curriculum-db
        ports:
            - "127.0.0.3:${TEST_POSTGRES_PORT:-15432}:5432"

    # A single-node replica set, not the base file's standalone: Mongo only
    # allows transactions on a replica set, so against a standalone every
    # transactional path (reservations, iteration switch) silently takes
    # withOptionalTransaction's non-atomic fallback and e2e never exercises
    # the code production runs (#649).
    #
    # Auth plus --replSet needs a keyfile; a throwaway one per container is
    # enough for a single member. The healthcheck doubles as the one-shot
    # rs.initiate(): rs.status() throws until the set exists.
    #
    # The container's writable layer survives a restart (not a recreate), so
    # a second `up` finds the first boot's keyfile still there at 400 (owner
    # read-only) — the `>` redirect can't reopen it for writing, `&&` never
    # reaches `exec`, and the container restart-loops (#684). Remove it first
    # so a restart regenerates a fresh one exactly like a first boot.
    mongodb:
        container_name: ${TEST_PROJECT_NAME:-bluz-test}-mongodb
        hostname: mongodb
        entrypoint:
            - bash
            - -c
            - >-
                rm -f /tmp/mongo-keyfile &&
                openssl rand -base64 756 > /tmp/mongo-keyfile &&
                chmod 400 /tmp/mongo-keyfile &&
                exec python3 /usr/local/bin/docker-entrypoint.py mongod
                --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
                --wiredTigerCacheSizeGB ${MONGO_CACHE_SIZE_GB:-0.5}
        command: !reset []
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME"
                    -p "$$MONGO_INITDB_ROOT_PASSWORD" --eval
                    "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
            interval: 5s
            timeout: 10s
            retries: 24
            start_period: 10s
        ports:
            - "127.0.0.3:${TEST_MONGO_PORT:-17017}:27017"

    sessions:
        container_name: ${TEST_PROJECT_NAME:-bluz-test}-sessions

    proxy:
        container_name: ${TEST_PROJECT_NAME:-bluz-test}-proxy
        ports: !override
            - "127.0.0.3:${TEST_PROXY_PORT_HTTP:-8080}:80"
            - "127.0.0.3:${TEST_PROXY_PORT_HTTPS:-8443}:443"
        volumes: !override
            - ./../nginx/nginx.conf.test:/etc/nginx/nginx.conf:ro
            - ./../nginx/ssl:/etc/nginx/ssl:ro
