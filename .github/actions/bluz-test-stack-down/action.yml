name: Tear down Bluz test stacks
description: >-
    Removes every `bluz-test-*` compose project on this daemon: containers,
    anonymous and named volumes, networks. run_tests.py starts the stack with
    `restart: always` and never tears it down, so a run that died early leaves
    one behind. Used both to reclaim leaks before a run and to stop the stack
    after it (#729). Only bluz-test-* is touched unless `prune` is on.

inputs:
    compose-files:
        description: >-
            Extra `-f` files for `compose down` (space-separated). Empty uses
            the project's own labels, which also works for a project whose
            compose file is gone.
        required: false
        default: ""
    prune:
        description: >-
            "true" also prunes ALL unused volumes, images and build cache and
            reports free disk. Throwaway VMs only: never on the shared-hive
            box, where it would delete the shared Hive.
        required: false
        default: "false"

runs:
    using: composite
    steps:
        - name: Remove bluz-test-* stacks
          shell: bash
          env:
              COMPOSE_FILES: ${{ inputs.compose-files }}
              PRUNE: ${{ inputs.prune }}
          run: |
              files=""
              for f in $COMPOSE_FILES; do files="$files -f $f"; done
              projects=$(docker ps -aq --filter "name=^/bluz-test-" \
                  | xargs -r docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' \
                  | sort -u || true)
              for proj in $projects; do
                  echo "Removing compose project: $proj"
                  # shellcheck disable=SC2086
                  docker compose -p "$proj" $files down -v --remove-orphans || true
              done
              # Whatever survived `compose down` (a project whose files are gone
              # still leaves labelled containers). -v takes anonymous volumes.
              leftovers=$(docker ps -aq --filter "name=^/bluz-test-" || true)
              [ -n "$leftovers" ] && docker rm -f -v $leftovers || true
              # Named volumes and networks outlive their containers; once those
              # are gone the project can no longer be discovered from them.
              for proj in $projects; do
                  docker volume ls -q --filter "label=com.docker.compose.project=$proj" \
                      | xargs -r docker volume rm -f || true
                  docker network ls -q --filter "label=com.docker.compose.project=$proj" \
                      | xargs -r docker network rm || true
              done

              [ "$PRUNE" = "true" ] || exit 0
              docker volume prune -af || true
              docker builder prune -af || true
              docker image prune -af || true
              docker system df || true
              avail_gb=$(($(df -Pk / | awk 'NR==2 {print $4}') / 1024 / 1024))
              echo "Free disk after reclaim: ${avail_gb} GB"
              if [ "$avail_gb" -lt 10 ]; then
                  echo "::warning::Only ${avail_gb} GB free after reclaiming everything this daemon can see. The rest is held by the runner host (stale _work/, /opt/hive) and needs manual cleanup."
              fi
