# ---------------------------------------------------------------------------
# GitHub-hosted runner mirror. Generated from the self-hosted workflow of the
# same name; the ONLY difference is `runs-on:` (every `[self-hosted, ...]`
# label set became `ubuntu-latest`). E2E is deliberately not mirrored — it
# stays on the self-hosted box.
#
# Exactly one of the two copies should be enabled at a time. See
# .github/workflows/README-cloud-runners.md for the switch commands.
# ---------------------------------------------------------------------------

name: Build and Release Bluz (Cloud Runners)

on:
    # push is restricted to the long-lived branches on purpose. With
    # `push: ["**"]` alongside `pull_request: ["**"]`, every commit on a PR
    # branch ran this workflow twice — once per event — and the two runs did
    # not cancel each other, because the concurrency key includes github.ref,
    # which is refs/heads/<branch> for push but refs/pull/N/merge for
    # pull_request. That doubled every PR's CI cost on a shared runner.
    push:
        branches: [master, dev]
        tags: ["v*.*.*", "v*.*.*-rc*", "ci-test"]
    pull_request:
        branches: ["**"]

# Cancel in-progress runs for PRs to save runner minutes
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME_UI: system-b90/bluz/ui
    IMAGE_NAME_SESSIONS: system-b90/bluz/sessions
    IMAGE_NAME_PROXY: system-b90/bluz/proxy
    # Public images required for the offline bundle
    IMAGE_POSTGRES: postgres:15-alpine
    IMAGE_MONGO: mongodb/mongodb-community-server:8.0-ubuntu2204

jobs:
    # Lint and unit tests were separate jobs, each with its own checkout, Node
    # setup and `npm ci`. Both already run on the single self-hosted box, where
    # they queue rather than overlap — so the split bought a second full
    # install and no parallelism. `!cancelled()` on the later steps preserves
    # the one thing it did provide: a lint failure still doesn't hide a test
    # failure.
    verify:
        name: Lint + Typecheck + Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 60
        # Dependabot PRs are single dep bumps; CI on them wastes runner
        # minutes. Run this only for humans. Version-bump commits on master
        # (chore: bump version to *) are metadata-only, so skip CI on them too.
        #
        # The bump-commit skip is scoped to branch pushes. publish.py tags the
        # very commit it bumps, so the release tag arrives carrying the same
        # head_commit.message — and an unscoped check skipped the entire release
        # pipeline, taking build-ui/sessions/proxy and craft-release down with
        # it. v1.0.0-rc.2 was tagged into that hole and published nothing.
        if: >-
            vars.BLUZ_CI_RUNNER == 'cloud'
            && github.actor != 'dependabot[bot]'
            && !(github.ref_type == 'branch'
                 && startsWith(github.event.head_commit.message, 'chore: bump version to'))
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # Runner is self-hosted with persistent disk — npm/pip already
            # survive between runs on disk. The actions/cache-backed `cache:`
            # option instead uploads/downloads a GH Actions cache blob every
            # run; on this box that blob had grown to 26GB (nothing ever
            # pruned it) and uploading it at self-hosted bandwidth exceeded
            # the 30m job timeout every time, cancelling the whole release.
            - name: Setup Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install Dependencies (Node)
              run: npm ci
              env:
                  NPM_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}

            - name: Install Dependencies (Python)
              run: pip install ruff==0.15.20

            - name: Run ESLint
              run: npm run lint

            - name: Run Ruff (Python Linter)
              if: ${{ !cancelled() }}
              run: ruff check .

            - name: Run Ruff (Python Formatter Check)
              if: ${{ !cancelled() }}
              run: ruff format --check .

            # The only tsc invocation in this pipeline used to be inside
            # `next build`, which is skipped on pull requests — so a PR with a
            # type error passed every check and broke master. `tsc --noEmit` is
            # far cheaper than a build and covers the gap. See #344.
            - name: Type-check UI
              if: ${{ !cancelled() }}
              run: npm run typecheck

            - name: Run Unit Tests
              if: ${{ !cancelled() }}
              run: npm run test:unit
              env:
                  NEXTAUTH_SECRET: ci_test_secret_key

            # session-server/ is a separate package with its own
            # package.json, lockfile and tsconfig, and nothing checked it on a
            # PR: the root lint/test jobs never touch it, and the only thing
            # that compiled it — Build Sessions Image — is skipped on pull
            # requests. So a change that broke it (its own dependency bumps
            # very much included) stayed invisible until a push to master or a
            # tag. Type-check it here, where it's cheap.
            # `npm ci`, so lockfile drift fails the check loudly instead of
            # being silently reconciled the way `npm install` does — that's how
            # the lock went stale unnoticed in the first place (#345).
            - name: Install session-server dependencies
              if: ${{ !cancelled() }}
              working-directory: session-server
              run: npm ci
              env:
                  NPM_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}

            - name: Lint session-server
              if: ${{ !cancelled() }}
              working-directory: session-server
              run: npm run lint

            - name: Build session-server
              if: ${{ !cancelled() }}
              working-directory: session-server
              run: npm run build

    build-ui:
        name: Build UI Image
        needs: [verify]
        if: >-
            vars.BLUZ_CI_RUNNER == 'cloud'
            && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # All self-hosted runners on this box run as the same OS user, so
            # ~/.docker/buildx state is shared. Without a unique builder name,
            # this job's builder can collide with — and get torn down by — a
            # concurrent build-sessions/build-proxy job's cleanup step,
            # killing this build mid-flight. See incident on v0.5.0 release.
            # The name is per-job but NOT per-run, and cleanup is off, so the
            # buildkit container stays warm between runs: a cold boot on this
            # contended box can overrun buildx's readiness window and fail with
            # "dial unix /run/buildkit/buildkitd.sock: no such file".
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  name: builder-ui
                  cleanup: false

            - name: Log in to GitHub Container Registry
              if: startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for UI Image
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=tag
                      type=sha,format=short

            - name: Build and push UI Image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ui/Dockerfile
                  push: ${{ startsWith(github.ref, 'refs/tags/v') }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      WEBSOCKET_SESSION_SERVER_SENDER_AUTH_KEY=ci_build_placeholder
                      NPM_TOKEN=${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    build-sessions:
        name: Build Sessions Image
        needs: [verify]
        if: >-
            vars.BLUZ_CI_RUNNER == 'cloud'
            && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  name: builder-sessions
                  cleanup: false

            - name: Log in to GitHub Container Registry
              if: startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Sessions Image
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SESSIONS }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=tag
                      type=sha,format=short

            - name: Build and push Sessions Image
              uses: docker/build-push-action@v7
              with:
                  context: session-server/
                  file: session-server/Dockerfile.websocket
                  push: ${{ startsWith(github.ref, 'refs/tags/v') }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      NPM_TOKEN=${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    build-proxy:
        name: Build Proxy Image
        # Same branch-only scoping as `verify` above: without it a release tag,
        # which points at the bump commit, skips its own proxy build.
        if: >-
            vars.BLUZ_CI_RUNNER == 'cloud'
            && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
            && !(github.ref_type == 'branch'
                 && startsWith(github.event.head_commit.message, 'chore: bump version to'))
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  name: builder-proxy
                  cleanup: false

            - name: Log in to GitHub Container Registry
              if: startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Proxy Image
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROXY }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=tag
                      type=sha,format=short

            - name: Build and push Proxy Image
              uses: docker/build-push-action@v7
              with:
                  context: nginx/
                  file: nginx/Dockerfile.proxy
                  push: ${{ startsWith(github.ref, 'refs/tags/v') }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    craft-release:
        name: Craft Release Packages
        needs: [build-ui, build-sessions, build-proxy]
        if: >-
            vars.BLUZ_CI_RUNNER == 'cloud'
            && (startsWith(github.ref, 'refs/tags/v'))
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: write
            packages: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare Workspace
              run: |
                  mkdir -p release-online/images
                  mkdir -p release-offline/images

                  # Copy deployment scripts into both bundles
                  cp ./scripts/install.sh ./scripts/update.sh ./scripts/setup.py ./scripts/requirements.txt release-online/
                  cp ./scripts/install.sh ./scripts/update.sh ./scripts/setup.py ./scripts/requirements.txt release-offline/

                  # Ship the release compose file (not the dev one) as docker-compose.yml
                  # at the bundle root — see #451, the dev file breaks every documented
                  # topology when shipped as-is.
                  cp deploy/docker-compose.release.yml release-online/docker-compose.yml
                  cp deploy/docker-compose.release.yml release-offline/docker-compose.yml

                  # install.sh's closing message points at ./link-hive.sh, and link-hive.sh
                  # reads docker-compose.hive-local.yml from the bundle root. Both must ship
                  # or the co-located Hive topology is uninstallable from a release (#452).
                  cp ./scripts/link-hive.sh ./scripts/link-hive.ps1 deploy/docker-compose.hive-local.yml release-online/
                  cp ./scripts/link-hive.sh ./scripts/link-hive.ps1 deploy/docker-compose.hive-local.yml release-offline/

                  # update.sh shells out to the backup scripts before it touches
                  # anything, and they are the documented restore path, so both
                  # bundles ship them at the location update.sh looks in first.
                  mkdir -p release-online/backup release-offline/backup
                  cp deploy/backup/bluz-backup.sh deploy/backup/bluz-restore.sh release-online/backup/
                  cp deploy/backup/bluz-backup.sh deploy/backup/bluz-restore.sh release-offline/backup/

                  # Guard: fail loudly if the bundle ever ships the dev compose file or is
                  # missing anything install.sh references (see #451, #452).
                  for dir in release-online release-offline; do
                      grep -q '\.\./\.env' "${dir}/docker-compose.yml" \
                          && { echo "::error::${dir} shipped the dev compose file"; exit 1; }
                      for f in link-hive.sh docker-compose.hive-local.yml; do
                          [ -f "${dir}/${f}" ] || { echo "::error::install.sh references ${f} but it is not in ${dir}"; exit 1; }
                      done
                  done

                  # Pin online bundle to this release's tag (the "latest" GHCR tag is never published)
                  echo "${{ github.ref_name }}" > release-online/VERSION

            - name: Export Offline Images
              run: |
                  TAG_NAME=${{ github.ref_name }}

                  echo "Pulling freshly built custom images..."
                  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}:$TAG_NAME
                  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SESSIONS }}:$TAG_NAME
                  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROXY }}:$TAG_NAME

                  echo "Pulling public database images..."
                  docker pull ${{ env.IMAGE_POSTGRES }}
                  docker pull ${{ env.IMAGE_MONGO }}

                  echo "Saving custom images to flat archives..."
                  docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}:$TAG_NAME -o release-offline/images/bluz-ui.tar
                  docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SESSIONS }}:$TAG_NAME -o release-offline/images/bluz-sessions.tar
                  docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROXY }}:$TAG_NAME -o release-offline/images/bluz-proxy.tar

                  echo "Saving database images to flat archives..."
                  docker save ${{ env.IMAGE_POSTGRES }} -o release-offline/images/postgres.tar
                  docker save ${{ env.IMAGE_MONGO }} -o release-offline/images/mongodb.tar

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Build Python CLI
              run: |
                  python -m pip install --upgrade pip build
                  python -m build cli/

            - name: Compress Final Packages
              run: |
                  tar -czvf bluz-online-${{ github.ref_name }}.tar.gz -C release-online .
                  tar -czvf bluz-offline-${{ github.ref_name }}.tar.gz -C release-offline .

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      bluz-online-${{ github.ref_name }}.tar.gz
                      bluz-offline-${{ github.ref_name }}.tar.gz
                      cli/dist/*
                  generate_release_notes: true
                  draft: false
                  prerelease: false

    publish-cli-index:
        name: Publish bluz CLI to org pip index
        needs: craft-release
        if: >-
            vars.BLUZ_CI_RUNNER == 'cloud'
            && (startsWith(github.ref, 'refs/tags/v'))
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Build Python CLI
              run: |
                  python -m pip install --upgrade pip build
                  python -m build cli/

            # bluz is private; the .github repo is public and needs no Bluz
            # source or auth to install from — mirrors pyhive's publish.yml.
            - name: Checkout .github index repo
              uses: actions/checkout@v7
              with:
                  repository: System-B90/.github
                  token: ${{ secrets.CLASSIC_ACCESS_TOKEN }}
                  path: org-github

            - name: Copy distributions and regenerate index
              run: |
                  mkdir -p org-github/pypi/bluz-cli
                  cp cli/dist/* org-github/pypi/bluz-cli/
                  python org-github/pypi/generate_index.py bluz-cli

            - name: Commit and push index update
              working-directory: org-github
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add pypi/
                  git diff --cached --quiet && exit 0
                  git commit -m "Vibe-Updated pip index for bluz-cli ${{ github.ref_name }}"
                  git push
