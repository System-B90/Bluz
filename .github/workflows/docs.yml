name: Deploy Documentation

# GitHub Pages for the org is served from System-B90/.github, not from this
# (private) repo, so all repos' docs live under one public site. This build
# lands the built site at bluz/ in that repo instead of deploying its own
# Pages environment.
on:
  push:
    tags: ['*']
  workflow_dispatch:

# Only allow one docs deployment at a time
concurrency:
  group: docs-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # mkdocs-typedoc shells out to typedoc, which walks the same UI sources
    # that OOM'd eslint and `next build` at a GitHub-hosted runner's ~2G
    # default heap. This job only runs on tags, so a heap failure here would
    # surface at the worst possible moment.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}

      - name: Install Python doc tools
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-typedoc "mkdocs-typer2[mkdocs]"
          pip install ./cli

      - name: Build documentation site
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: python -m mkdocs build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: bluz-docs-site
          path: site/

  publish:
    name: Publish to System-B90/.github
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: bluz-docs-site
          path: site/

      - name: Checkout System-B90/.github
        uses: actions/checkout@v7
        with:
          repository: System-B90/.github
          token: ${{ secrets.CLASSIC_ACCESS_TOKEN }}
          path: dot-github

      - name: Sync bluz/ docs and push
        run: |
          rm -rf dot-github/bluz
          mkdir -p dot-github/bluz
          cp -r site/. dot-github/bluz/
          cd dot-github
          git config user.name "bluz-docs-bot"
          git config user.email "actions@github.com"
          git add bluz
          if git diff --cached --quiet; then
            echo "No doc changes to publish."
            exit 0
          fi
          git commit -m "docs(bluz): sync from System-B90/Bluz@${GITHUB_SHA}"
          git push origin main
