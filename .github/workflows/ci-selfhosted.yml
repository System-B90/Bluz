name: CI (Self-Hosted)

# Runs the core CI checks (lint + unit tests) on the self-hosted runner
# (mks-srvu). Triggered manually so it can be pointed at any ref.
on:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint Codebase
        runs-on: self-hosted
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install Dependencies (Node)
              run: npm ci
              env:
                  NPM_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}

            - name: Install Dependencies (Python)
              run: pip install ruff

            - name: Run ESLint
              run: npm run lint

            - name: Run Ruff (Python Linter)
              run: ruff check .

            - name: Run Ruff (Python Formatter Check)
              run: ruff format --check .

    test:
        name: Unit Tests
        runs-on: self-hosted
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci
              env:
                  NPM_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}

            - name: Run Unit Tests
              run: npm run test:unit
              env:
                  NEXTAUTH_SECRET: ci_test_secret_key
