name: E2E Tests

on:
    workflow_dispatch:
        inputs:
            target:
                description: >-
                    Where the test suite runs. The images are always built on
                    GitHub-hosted runners. self-hosted runs one unified test
                    job (single Hive+Bluz stack — the mks-srvu box can't host 3
                    at once). github-hosted runs the classic 3-shard matrix
                    (each GitHub-hosted runner is a separate VM, so 3 stacks is
                    free).
                type: choice
                options:
                    - self-hosted
                    - github-hosted
                default: self-hosted
    # Master only, deliberately. A full e2e run occupies the single self-hosted
    # box for the best part of an hour, and running it per pull request meant
    # the org's one shared runner was spent on branches that get force-pushed
    # and rebased. There is no `pull_request:` trigger here — use
    # workflow_dispatch to run the suite against a branch on purpose.
    #
    # The path filter narrows it further to what can actually change what the
    # suite exercises: the app, the specs, and the runtime topology. Docs,
    # workflow config, the CLI and tooling do not reach e2e at all.
    push:
        branches: [master]
        paths:
            - 'ui/**'
            - 'tests/**'
            - 'deploy/**'
            - 'nginx/**'
            - 'session-server/**'
            - 'package.json'
            - 'package-lock.json'

# Cancel on branches, queue on master.
#
# There is one self-hosted runner, so the runner already serialises: a second
# job cannot overlap, it waits. cancel-in-progress was therefore never
# protecting the box -- its only job is skipping superseded commits, and on
# master it was doing that so aggressively it destroyed runs that had already
# paid their full cost. Of the last 29 master runs, 14 were cancelled and none
# succeeded; two of those cancellations landed at 47 and 50 minutes, i.e. at
# the finish line, after monopolising the only runner for the best part of an
# hour. Master's real state went unverified for days at a time, which is how
# the #633 regression reached it unnoticed.
#
# Queuing does not build a backlog: GitHub keeps at most one running and one
# pending run per group and cancels the older *pending* one, so a burst of
# merges coalesces to "test the newest commit" on its own -- without ever
# killing a run in flight.
#
# Branches keep cancelling. They are force-pushed and rebased constantly, and
# there a superseded run really is worthless.
#
# workflow_dispatch gets its own group so a deliberate verification run is not
# collateral damage from an unrelated push to the same ref. Safe for the same
# reason as above: on self-hosted the runner serialises regardless, and the
# github-hosted target runs on separate VMs where overlap costs nothing.
concurrency:
    group: >-
        ${{ github.workflow }}-${{ github.ref }}-${{
        github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    # Image builds are pure CPU with no Hive dependency and their artifact is
    # portable, so they run on GitHub-hosted runners no matter where the suite
    # itself lands. That keeps the one thing the self-hosted box is actually
    # needed for — the long test run — off a builder that kept dying under its
    # own load: three named, warm buildkits shared one 8-vCPU host with the
    # release pipeline's lint job and 14 Hive containers, and the UI build
    # failed with "frontend grpc server closed unexpectedly" often enough that
    # a continue-on-error retry was papering over it (the retry then failed the
    # job anyway, master 23f3af5). An ephemeral VM per run has none of that
    # contention, so the builder pinning and the retries are gone with it.
    build-test-images:
        name: Build Test Images
        runs-on: ubuntu-24.04
        # Version-bump commits on master (chore: bump version to *) only touch
        # package.json, so they'd otherwise trigger a full e2e run for nothing.
        if: >-
            (github.event_name != 'pull_request' || github.head_ref == 'dev')
            && !startsWith(github.event.head_commit.message, 'chore: bump version to')
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Build once here instead of once per shard (#e2e-perf). Tags match
            # exactly what deploy/docker-compose.yml resolves to with
            # BLUZ_VERSION=latest, so each shard's `docker compose up` finds the
            # image already present locally and skips building it again.
            - name: Build UI Image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ui/Dockerfile
                  target: runner
                  load: true
                  tags: ghcr.io/system-b90/bluz/ui:latest
                  build-args: |
                      NPM_TOKEN=${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
                  cache-from: type=gha,scope=e2e-ui
                  cache-to: type=gha,mode=max,scope=e2e-ui

            - name: Build Sessions Image
              uses: docker/build-push-action@v7
              with:
                  context: session-server/
                  file: session-server/Dockerfile.websocket
                  load: true
                  tags: ghcr.io/system-b90/bluz/sessions:latest
                  build-args: |
                      NPM_TOKEN=${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
                  cache-from: type=gha,scope=e2e-sessions
                  cache-to: type=gha,mode=max,scope=e2e-sessions

            - name: Build Proxy Image
              uses: docker/build-push-action@v7
              with:
                  context: nginx/
                  file: nginx/Dockerfile.proxy
                  load: true
                  tags: ghcr.io/system-b90/bluz/proxy:latest
                  cache-from: type=gha,scope=e2e-proxy
                  cache-to: type=gha,mode=max,scope=e2e-proxy

            - name: Save images
              run: |
                  mkdir -p test-images
                  docker save ghcr.io/system-b90/bluz/ui:latest -o test-images/ui.tar
                  docker save ghcr.io/system-b90/bluz/sessions:latest -o test-images/sessions.tar
                  docker save ghcr.io/system-b90/bluz/proxy:latest -o test-images/proxy.tar

            - name: Upload images
              uses: actions/upload-artifact@v7
              with:
                  name: test-images
                  path: test-images/
                  retention-days: 1

    # ── Self-hosted (mks-srvu): ONE unified job, ONE Hive+Bluz stack ─────────
    # This box is a single 8-vCPU/23G host; 3 concurrent Hive stacks saturate
    # the CPU and starve hive-postgres/redis past their healthchecks. The suite
    # already runs one Chromium at a time (playwright.config.ts: workers=1,
    # fullyParallel=false, retries=2), so a single stack is both lighter and
    # green. Runs by default (push/PR) and on dispatch target=self-hosted.
    full-test-suite-selfhosted:
        name: Full Test Suite (E2E, self-hosted)
        runs-on: [self-hosted, dind]
        timeout-minutes: 90
        needs: build-test-images
        if: >-
            (github.event_name != 'pull_request' || github.head_ref == 'dev')
            && !(github.event_name == 'workflow_dispatch' && inputs.target == 'github-hosted')
            && !startsWith(github.event.head_commit.message, 'chore: bump version to')
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # run_tests.py brings the Bluz stack up as compose project
            # `bluz-test-<worktree-slug>` and never tears it down, while
            # deploy/docker-compose.yml marks the services `restart: always`.
            # So any run that dies before its teardown — a cancel, a timeout, a
            # failed setup — leaves a full Bluz stack running on the box
            # forever, and the teardown below only ever cleaned up `hive-*`.
            # Four such stacks (two 4 days old, two 5 days old) had piled up by
            # 0d7b947, several stuck in restart loops, and they starved this
            # box badly enough that setup-hive hit its own 60-minute timeout
            # without ever bringing Hive up.
            #
            # This box runs one e2e job at a time by design (see the job
            # comment above), so anything matching these names at the start of
            # a run is leaked, not live — the same assumption the `hive-*`
            # cleanup already makes.
            - name: Reclaim leaked test stacks
              run: |
                  projects=$(docker ps -aq --filter "name=^/bluz-test-" \
                      | xargs -r docker inspect \
                        --format '{{index .Config.Labels "com.docker.compose.project"}}' \
                      | sort -u || true)
                  for proj in $projects; do
                      echo "Removing leaked compose project: $proj"
                      docker compose -p "$proj" down -v --remove-orphans || true
                  done
                  # Force-remove whatever survived the compose down (a project
                  # whose compose file is gone still leaves labelled containers).
                  leftovers=$(docker ps -aq --filter "name=^/bluz-test-" || true)
                  [ -n "$leftovers" ] && docker rm -f $leftovers || true
                  for proj in $projects; do
                      docker volume ls -q \
                          --filter "label=com.docker.compose.project=$proj" \
                          | xargs -r docker volume rm -f || true
                      docker network ls -q \
                          --filter "label=com.docker.compose.project=$proj" \
                          | xargs -r docker network rm || true
                  done
                  # Reclaiming the containers is not enough on its own: the
                  # box sat at 100% disk (455G, 0 bytes free) even after every
                  # leaked stack was gone, and setup-hive refuses to start Hive
                  # under 10GB free. Its own cleanup is deliberately
                  # conservative on self-hosted runners — `docker image prune`
                  # without -a, `volume prune` without -a — and a plain
                  # `volume prune` skips *named* volumes, which is precisely
                  # what a leaked compose stack leaves behind. That left
                  # 11.75GB of volumes and 8.19GB of images reported as
                  # reclaimable while the run failed for want of space.
                  #
                  # Between runs nothing on this box is meant to be alive, so
                  # "unused" here means "garbage". Images and build cache are
                  # re-pulled and rebuilt on demand; disk is the scarce thing.
                  docker volume prune -af || true
                  docker builder prune -af || true
                  docker image prune -af || true

                  docker ps -a --format 'table {{.Names}}\t{{.Status}}'
                  docker system df || true
                  df -h / || true

                  # Surface the host-level shortfall explicitly. If this still
                  # reads under 10GB, the space is held outside this daemon —
                  # stale _work/ directories or /opt/hive on the runner host —
                  # and needs hands on the box; setup-hive will fail straight
                  # after this with the same number.
                  avail_gb=$(($(df -Pk / | awk 'NR==2 {print $4}') / 1024 / 1024))
                  echo "Free disk after reclaim: ${avail_gb} GB"
                  if [ "$avail_gb" -lt 10 ]; then
                      echo "::warning::Only ${avail_gb} GB free after reclaiming every leaked stack, volume, image and build cache this daemon can see. The remaining space is held by the runner host itself (stale _work/ directories, /opt/hive), which CI cannot reach — the box needs manual cleanup."
                  fi

            - name: Set up Hive
              uses: System-B90/.github/actions/setup-hive@main
              with:
                  hive-token: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
                  registry-token: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
                  image-source: registry
                  extra-hosts: 127.0.0.3 bluz.dev
                  python-version: "3.13"

            - name: Install Python dependencies (pyhive)
              # A venv, not a bare `pip install`: the self-hosted runner's
              # interpreter is PEP 668 externally-managed, so the bare install
              # aborts there. Putting it on PATH keeps later steps calling
              # plain `python`/`pip` unchanged on either runner class.
              run: |
                  python -m venv "${RUNNER_TEMP}/pyhive-venv"
                  echo "${RUNNER_TEMP}/pyhive-venv/bin" >> "$GITHUB_PATH"
                  "${RUNNER_TEMP}/pyhive-venv/bin/pip" install --upgrade pip
                  "${RUNNER_TEMP}/pyhive-venv/bin/pip" install -r scripts/requirements.txt

            - name: Verify Hive admin login via pyhive
              run: |
                  python - <<'PY'
                  from pyhive import HiveClient

                  with HiveClient("admin", "Password1", "https://hive.org", verify=False, timeout=30) as client:
                      print("Hive admin login OK. API version:", client.get_hive_version())
                  PY

            - name: Generate CI .env
              run: |
                  PG_PASS=$(openssl rand -hex 16)
                  MONGO_PASS=4Cqoz8M7g1oYHxaOuCBsOSi7KeOvWWRP
                  cat > .env <<EOF
                  BLUZ_VERSION=latest
                  # setup-hive checks Hive out to hive/, so its compose network
                  # is hive_hive-net, not the hive-stack_hive-net a local
                  # checkout produces.
                  HIVE_NETWORK_NAME=hive_hive-net
                  WEBSOCKET_SESSION_SERVER_SENDER_AUTH_KEY=$(openssl rand -hex 32)
                  NEXT_PUBLIC_HIVE_URL=https://hive.org
                  NODE_TLS_REJECT_UNAUTHORIZED=0
                  NEXTAUTH_URL=https://bluz.dev
                  NEXTAUTH_SECRET=$(openssl rand -hex 32)
                  HIVE_CLIENT_ID=ci-placeholder
                  HIVE_CLIENT_SECRET=ci-placeholder
                  MONGO_ROOT_USER=mongo_admin
                  MONGO_ROOT_PASSWORD=${MONGO_PASS}
                  MONGO_CONNECTION_STRING=mongodb://mongo_admin:${MONGO_PASS}@bluz-mongodb:27017/?authSource=admin
                  JWT_SECRET=$(openssl rand -hex 32)
                  SYM_ENC_KEY=$(openssl rand -hex 32)
                  POSTGRES_USER=admin
                  POSTGRES_PASSWORD=${PG_PASS}
                  POSTGRES_DB=curriculum_db
                  DATABASE_URL=postgres://admin:${PG_PASS}@bluz-curriculum-db:5432/curriculum_db
                  EOF

            - name: Generate self-signed SSL certificates
              run: |
                  mkdir -p nginx/ssl
                  openssl req -x509 -newkey rsa:4096 -keyout nginx/ssl/key.pem \
                    -out nginx/ssl/cert.pem -sha256 -days 30 -nodes -subj "/CN=bluz.dev"

            - name: Set up Node + Playwright
              uses: System-B90/.github/actions/setup-playwright@main
              env:
                  # `npm ci` resolves the internal @system-b90/* packages from
                  # GitHub Packages; .npmrc reads NPM_TOKEN. The default
                  # GITHUB_TOKEN can't read cross-repo packages, so pass a PAT
                  # with read:packages (same one the image builds use).
                  NPM_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}

            - name: Download Test Images
              uses: actions/download-artifact@v8
              with:
                  name: test-images
                  path: test-images/

            - name: Load Test Images
              run: |
                  docker load -i test-images/ui.tar
                  docker load -i test-images/sessions.tar
                  docker load -i test-images/proxy.tar
                  rm -rf test-images/

            # Frees the (~160MB) test-images artifact right away instead of
            # waiting out retention-days, which only supports whole-day
            # granularity and was already at its 1-day floor.
            - name: Delete Test Images artifact
              if: always()
              uses: actions/github-script@v9
              with:
                  script: |
                      const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: context.runId,
                      });
                      const artifact = data.artifacts.find(a => a.name === 'test-images');
                      if (artifact) {
                          try {
                              await github.rest.actions.deleteArtifact({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  artifact_id: artifact.id,
                              });
                          } catch (e) {
                              // Best-effort: another parallel shard may have deleted it first.
                              core.warning(`Could not delete test-images artifact: ${e.message}`);
                          }
                      }

            - name: Run Full Test Suite
              run: python scripts/run_tests.py --seed-hive --skip-unit
              env:
                  CI: true

            - name: Upload Playwright Report
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 1

            - name: Upload Test Results
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 1

            - name: Dump Container Logs
              if: failure()
              run: |
                  mkdir -p container-logs
                  docker ps -a
                  # Bounded: this loop ran against every container on the box
                  # and spent 28 minutes on a wedged daemon at 0d7b947, eating
                  # the rest of the job's timeout and delaying the teardown
                  # below — which is what leaks the next stack.
                  for c in $(docker ps -aq); do
                    name=$(docker inspect --format '{{.Name}}' "$c" | tr -d '/')
                    timeout 30 docker logs --tail 2000 "$c" \
                      > "container-logs/$name.log" 2>&1 || true
                  done
                  echo "::group::Bluz UI container status + log (tail)"
                  ui=$(docker ps -a --filter "name=-ui" --format '{{.Names}}' | head -1)
                  if [ -n "$ui" ]; then
                    docker inspect --format 'State={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Restarts={{.RestartCount}}' "$ui" || true
                    docker logs --tail 400 "$ui" 2>&1 || true
                  else
                    echo "No Bluz UI container found."
                  fi
                  echo "::endgroup::"
                  echo "::group::Bluz UI migration errors (if any)"
                  if [ -n "$ui" ]; then
                    docker logs "$ui" 2>&1 | grep -iE "migration|Cannot find module|MODULE_NOT_FOUND" || echo "No migration-related errors found in UI container log."
                  fi
                  echo "::endgroup::"

            - name: Upload Container Logs
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: container-logs
                  path: container-logs/
                  retention-days: 1

            # Hive's services are restart: always, so nothing stops them when
            # the job ends and they come back with the (ephemeral) runner
            # container. Three idle runners were each holding a full Hive
            # stack, which left the box in disk-wait at load ~30 with no jobs
            # running — and that is what made the next run's nested containerd
            # time out on startup. Runs after the log upload so a failing run
            # still gets its diagnostics.
            - name: Tear down test + Hive stacks
              if: always()
              run: |
                  # The Bluz stack goes first and unconditionally: leaving it up
                  # is what wedged this box for five days (see "Reclaim leaked
                  # test stacks" above). `docker compose down` alone is not
                  # enough — on a run that died before checkout finished, the
                  # compose file may not even be on disk — so each cleanup ends
                  # with a name-filtered `rm -f`.
                  # -v: take the container's anonymous volumes with it. Mongo
                  # and Postgres each create one per run, and without this they
                  # are orphaned the moment the container goes. The reclaim step
                  # at the top of the next run cannot recover them either: it
                  # discovers compose projects *from surviving containers*, so
                  # removing the containers is exactly what makes their volumes
                  # undiscoverable. ~47GB had accumulated that way by
                  # 2026-09-03, filling the runner and failing every
                  # Hive-booting job in the org (System-B90/.github#12).
                  bluz=$(docker ps -aq --filter "name=^/bluz-test-" || true)
                  [ -n "$bluz" ] && docker rm -f -v $bluz || true

                  docker compose -f hive/docker-compose.yaml down -v --remove-orphans || true
                  leftovers=$(docker ps -aq --filter "name=^/hive-" 2>/dev/null || true)
                  [ -n "$leftovers" ] && docker rm -f $leftovers || true

    # ── GitHub-hosted: classic 3-shard matrix ───────────────────────────────
    # Each GitHub-hosted runner is its own VM, so 3 shards = 3 isolated stacks
    # in parallel at no shared-host cost. Runs only on an explicit dispatch
    # with target=github-hosted.
    full-test-suite-github:
        name: Full Test Suite (E2E, github-hosted) — shard ${{ matrix.shard }}/${{ strategy.job-total }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        needs: build-test-images
        if: >-
            (github.event_name != 'pull_request' || github.head_ref == 'dev')
            && github.event_name == 'workflow_dispatch' && inputs.target == 'github-hosted'
            && !startsWith(github.event.head_commit.message, 'chore: bump version to')
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # run_tests.py brings the Bluz stack up as compose project
            # `bluz-test-<worktree-slug>` and never tears it down, while
            # deploy/docker-compose.yml marks the services `restart: always`.
            # So any run that dies before its teardown — a cancel, a timeout, a
            # failed setup — leaves a full Bluz stack running on the box
            # forever, and the teardown below only ever cleaned up `hive-*`.
            # Four such stacks (two 4 days old, two 5 days old) had piled up by
            # 0d7b947, several stuck in restart loops, and they starved this
            # box badly enough that setup-hive hit its own 60-minute timeout
            # without ever bringing Hive up.
            #
            # This box runs one e2e job at a time by design (see the job
            # comment above), so anything matching these names at the start of
            # a run is leaked, not live — the same assumption the `hive-*`
            # cleanup already makes.
            - name: Reclaim leaked test stacks
              run: |
                  projects=$(docker ps -aq --filter "name=^/bluz-test-" \
                      | xargs -r docker inspect \
                        --format '{{index .Config.Labels "com.docker.compose.project"}}' \
                      | sort -u || true)
                  for proj in $projects; do
                      echo "Removing leaked compose project: $proj"
                      docker compose -p "$proj" down -v --remove-orphans || true
                  done
                  # Force-remove whatever survived the compose down (a project
                  # whose compose file is gone still leaves labelled containers).
                  leftovers=$(docker ps -aq --filter "name=^/bluz-test-" || true)
                  [ -n "$leftovers" ] && docker rm -f $leftovers || true
                  for proj in $projects; do
                      docker volume ls -q \
                          --filter "label=com.docker.compose.project=$proj" \
                          | xargs -r docker volume rm -f || true
                      docker network ls -q \
                          --filter "label=com.docker.compose.project=$proj" \
                          | xargs -r docker network rm || true
                  done
                  # Reclaiming the containers is not enough on its own: the
                  # box sat at 100% disk (455G, 0 bytes free) even after every
                  # leaked stack was gone, and setup-hive refuses to start Hive
                  # under 10GB free. Its own cleanup is deliberately
                  # conservative on self-hosted runners — `docker image prune`
                  # without -a, `volume prune` without -a — and a plain
                  # `volume prune` skips *named* volumes, which is precisely
                  # what a leaked compose stack leaves behind. That left
                  # 11.75GB of volumes and 8.19GB of images reported as
                  # reclaimable while the run failed for want of space.
                  #
                  # Between runs nothing on this box is meant to be alive, so
                  # "unused" here means "garbage". Images and build cache are
                  # re-pulled and rebuilt on demand; disk is the scarce thing.
                  docker volume prune -af || true
                  docker builder prune -af || true
                  docker image prune -af || true

                  docker ps -a --format 'table {{.Names}}\t{{.Status}}'
                  docker system df || true
                  df -h / || true

                  # Surface the host-level shortfall explicitly. If this still
                  # reads under 10GB, the space is held outside this daemon —
                  # stale _work/ directories or /opt/hive on the runner host —
                  # and needs hands on the box; setup-hive will fail straight
                  # after this with the same number.
                  avail_gb=$(($(df -Pk / | awk 'NR==2 {print $4}') / 1024 / 1024))
                  echo "Free disk after reclaim: ${avail_gb} GB"
                  if [ "$avail_gb" -lt 10 ]; then
                      echo "::warning::Only ${avail_gb} GB free after reclaiming every leaked stack, volume, image and build cache this daemon can see. The remaining space is held by the runner host itself (stale _work/ directories, /opt/hive), which CI cannot reach — the box needs manual cleanup."
                  fi

            - name: Set up Hive
              uses: System-B90/.github/actions/setup-hive@main
              with:
                  hive-token: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
                  registry-token: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
                  image-source: registry
                  extra-hosts: 127.0.0.3 bluz.dev
                  python-version: "3.13"

            - name: Install Python dependencies (pyhive)
              # A venv, not a bare `pip install`: the self-hosted runner's
              # interpreter is PEP 668 externally-managed, so the bare install
              # aborts there. Putting it on PATH keeps later steps calling
              # plain `python`/`pip` unchanged on either runner class.
              run: |
                  python -m venv "${RUNNER_TEMP}/pyhive-venv"
                  echo "${RUNNER_TEMP}/pyhive-venv/bin" >> "$GITHUB_PATH"
                  "${RUNNER_TEMP}/pyhive-venv/bin/pip" install --upgrade pip
                  "${RUNNER_TEMP}/pyhive-venv/bin/pip" install -r scripts/requirements.txt

            - name: Verify Hive admin login via pyhive
              run: |
                  python - <<'PY'
                  from pyhive import HiveClient

                  with HiveClient("admin", "Password1", "https://hive.org", verify=False, timeout=30) as client:
                      print("Hive admin login OK. API version:", client.get_hive_version())
                  PY

            - name: Generate CI .env
              run: |
                  PG_PASS=$(openssl rand -hex 16)
                  MONGO_PASS=4Cqoz8M7g1oYHxaOuCBsOSi7KeOvWWRP
                  cat > .env <<EOF
                  BLUZ_VERSION=latest
                  # setup-hive checks Hive out to hive/, so its compose network
                  # is hive_hive-net, not the hive-stack_hive-net a local
                  # checkout produces.
                  HIVE_NETWORK_NAME=hive_hive-net
                  WEBSOCKET_SESSION_SERVER_SENDER_AUTH_KEY=$(openssl rand -hex 32)
                  NEXT_PUBLIC_HIVE_URL=https://hive.org
                  NODE_TLS_REJECT_UNAUTHORIZED=0
                  NEXTAUTH_URL=https://bluz.dev
                  NEXTAUTH_SECRET=$(openssl rand -hex 32)
                  HIVE_CLIENT_ID=ci-placeholder
                  HIVE_CLIENT_SECRET=ci-placeholder
                  MONGO_ROOT_USER=mongo_admin
                  MONGO_ROOT_PASSWORD=${MONGO_PASS}
                  MONGO_CONNECTION_STRING=mongodb://mongo_admin:${MONGO_PASS}@bluz-mongodb:27017/?authSource=admin
                  JWT_SECRET=$(openssl rand -hex 32)
                  SYM_ENC_KEY=$(openssl rand -hex 32)
                  POSTGRES_USER=admin
                  POSTGRES_PASSWORD=${PG_PASS}
                  POSTGRES_DB=curriculum_db
                  DATABASE_URL=postgres://admin:${PG_PASS}@bluz-curriculum-db:5432/curriculum_db
                  EOF

            - name: Generate self-signed SSL certificates
              run: |
                  mkdir -p nginx/ssl
                  openssl req -x509 -newkey rsa:4096 -keyout nginx/ssl/key.pem \
                    -out nginx/ssl/cert.pem -sha256 -days 30 -nodes -subj "/CN=bluz.dev"

            - name: Set up Node + Playwright
              uses: System-B90/.github/actions/setup-playwright@main
              env:
                  NPM_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}

            - name: Download Test Images
              uses: actions/download-artifact@v8
              with:
                  name: test-images
                  path: test-images/

            - name: Load Test Images
              run: |
                  docker load -i test-images/ui.tar
                  docker load -i test-images/sessions.tar
                  docker load -i test-images/proxy.tar
                  rm -rf test-images/

            # Frees the (~160MB) test-images artifact right away instead of
            # waiting out retention-days, which only supports whole-day
            # granularity and was already at its 1-day floor.
            - name: Delete Test Images artifact
              if: always()
              uses: actions/github-script@v9
              with:
                  script: |
                      const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: context.runId,
                      });
                      const artifact = data.artifacts.find(a => a.name === 'test-images');
                      if (artifact) {
                          try {
                              await github.rest.actions.deleteArtifact({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  artifact_id: artifact.id,
                              });
                          } catch (e) {
                              // Best-effort: another parallel shard may have deleted it first.
                              core.warning(`Could not delete test-images artifact: ${e.message}`);
                          }
                      }

            - name: Run Full Test Suite
              run: python scripts/run_tests.py --seed-hive --skip-unit --shard ${{ matrix.shard }}/${{ strategy.job-total }}
              env:
                  CI: true

            - name: Upload Playwright Report
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report-${{ matrix.shard }}
                  path: playwright-report/
                  retention-days: 1

            - name: Upload Test Results
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: test-results-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 1

            - name: Dump Container Logs
              if: failure()
              run: |
                  mkdir -p container-logs
                  docker ps -a
                  # Bounded: this loop ran against every container on the box
                  # and spent 28 minutes on a wedged daemon at 0d7b947, eating
                  # the rest of the job's timeout and delaying the teardown
                  # below — which is what leaks the next stack.
                  for c in $(docker ps -aq); do
                    name=$(docker inspect --format '{{.Name}}' "$c" | tr -d '/')
                    timeout 30 docker logs --tail 2000 "$c" \
                      > "container-logs/$name.log" 2>&1 || true
                  done
                  echo "::group::Bluz UI container status + log (tail)"
                  ui=$(docker ps -a --filter "name=-ui" --format '{{.Names}}' | head -1)
                  if [ -n "$ui" ]; then
                    docker inspect --format 'State={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Restarts={{.RestartCount}}' "$ui" || true
                    docker logs --tail 400 "$ui" 2>&1 || true
                  else
                    echo "No Bluz UI container found."
                  fi
                  echo "::endgroup::"
                  echo "::group::Bluz UI migration errors (if any)"
                  if [ -n "$ui" ]; then
                    docker logs "$ui" 2>&1 | grep -iE "migration|Cannot find module|MODULE_NOT_FOUND" || echo "No migration-related errors found in UI container log."
                  fi
                  echo "::endgroup::"

            - name: Upload Container Logs
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: container-logs-${{ matrix.shard }}
                  path: container-logs/
                  retention-days: 1

            # Harmless on a throwaway VM, but keeps the two paths identical.
            - name: Tear down test + Hive stacks
              if: always()
              run: |
                  # -v: take the container's anonymous volumes with it. Mongo
                  # and Postgres each create one per run, and without this they
                  # are orphaned the moment the container goes. The reclaim step
                  # at the top of the next run cannot recover them either: it
                  # discovers compose projects *from surviving containers*, so
                  # removing the containers is exactly what makes their volumes
                  # undiscoverable. ~47GB had accumulated that way by
                  # 2026-09-03, filling the runner and failing every
                  # Hive-booting job in the org (System-B90/.github#12).
                  bluz=$(docker ps -aq --filter "name=^/bluz-test-" || true)
                  [ -n "$bluz" ] && docker rm -f -v $bluz || true

                  docker compose -f hive/docker-compose.yaml down -v --remove-orphans || true
                  leftovers=$(docker ps -aq --filter "name=^/hive-" 2>/dev/null || true)
                  [ -n "$leftovers" ] && docker rm -f $leftovers || true

    # ── Artifact cleanup, once every shard is done ───────────────────────────
    # Frees the (~160MB) test-images artifact right away instead of waiting out
    # retention-days, which only supports whole-day granularity and was already
    # at its 1-day floor.
    #
    # This deliberately lives in its own job rather than in the shard. Each
    # shard used to delete the artifact right after loading it, which is a race
    # the shards lose: the first one to finish loading deleted the artifact out
    # from under the others, and they then failed on "Artifact not found for
    # name: test-images" before running a single test. Run 33792691157 is the
    # example -- shard 1 green, shards 2 and 3 dead on download.
    #
    # The old step guarded the *delete* against a parallel shard having got
    # there first, which reads like the race was considered; but the problem was
    # never a double delete, it was deleting while other consumers still needed
    # it. `needs` the matrix so it cannot run until every shard has taken its
    # copy.
    cleanup-test-images:
        name: Delete Test Images artifact
        runs-on: ubuntu-24.04
        # Must wait for BOTH suites, not just the matrix. Only one of them
        # runs on any given trigger and the other is `skipped` -- and a skipped
        # need is a *satisfied* need, so gating on the github matrix alone let
        # this job start the moment the images were built and delete the
        # artifact while the self-hosted suite was still downloading it. That
        # is the same "delete while another consumer needs it" mistake this job
        # was created to fix, reintroduced one level up (run 33805356828).
        needs:
            [
                build-test-images,
                full-test-suite-selfhosted,
                full-test-suite-github,
            ]
        if: always() && needs.build-test-images.result == 'success'
        steps:
            - name: Delete Test Images artifact
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: context.runId,
                      });
                      const artifact = data.artifacts.find(a => a.name === 'test-images');
                      if (!artifact) return;
                      try {
                          await github.rest.actions.deleteArtifact({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              artifact_id: artifact.id,
                          });
                      } catch (e) {
                          core.warning(`Could not delete test-images artifact: ${e.message}`);
                      }
