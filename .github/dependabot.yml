version: 2

# @system-b90/* packages resolve from GitHub Packages (see .npmrc); without
# this, Dependabot can't authenticate to npm.pkg.github.com and any update
# that touches the lockfile's transitive deps on those packages fails with
# "401 Unauthorized - authentication token not provided".
registries:
    npm-github:
        type: npm-registry
        url: https://npm.pkg.github.com
        token: ${{secrets.NPM_TOKEN}}

updates:
    # Main app (root package.json covers ui/ via the monorepo layout)
    - package-ecosystem: "npm"
      directory: "/"
      registries:
          - npm-github
      schedule:
          interval: "cron"
          cronjob: "0 6 1,15 * *"
      open-pull-requests-limit: 4
      groups:
          minor-and-patch:
              update-types: ["minor", "patch"]
      commit-message:
          prefix: "Vibe-Bumped"

    # Standalone WebSocket session server
    - package-ecosystem: "npm"
      directory: "/session-server"
      registries:
          - npm-github
      schedule:
          interval: "cron"
          cronjob: "0 6 1,15 * *"
      open-pull-requests-limit: 4
      groups:
          minor-and-patch:
              update-types: ["minor", "patch"]
      commit-message:
          prefix: "Vibe-Bumped"

    # Python: bluz CLI + scripts tooling
    - package-ecosystem: "pip"
      directory: "/cli"
      schedule:
          interval: "cron"
          cronjob: "0 6 1,15 * *"
      open-pull-requests-limit: 4
      groups:
          minor-and-patch:
              update-types: ["minor", "patch"]
      commit-message:
          prefix: "Vibe-Bumped"

    - package-ecosystem: "pip"
      directory: "/scripts"
      schedule:
          interval: "cron"
          cronjob: "0 6 1,15 * *"
      open-pull-requests-limit: 4
      groups:
          minor-and-patch:
              update-types: ["minor", "patch"]
      commit-message:
          prefix: "Vibe-Bumped"

    # GitHub Actions pins
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "cron"
          cronjob: "0 6 1,15 * *"
      open-pull-requests-limit: 4
      commit-message:
          prefix: "Vibe-Bumped"
