[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluz-cli"
dynamic = ["version"]
description = "Bluz command-line tool — drive the Bluz scheduling & curriculum API from your terminal."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael K. Steinberg", email = "m.kuper.steinberg@gmail.com" }]
license = { text = "Proprietary" }
keywords = ["bluz", "cli", "scheduling", "curriculum", "gantt"]

dependencies = [
    "typer>=0.20.0",
    "InquirerPy>=0.3.4",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]

[project.scripts]
bluz = "bluz_cli.main:run"

[project.urls]
Homepage = "https://github.com/system-b15/bluz"
Repository = "https://github.com/system-b15/bluz"

[tool.hatch.build.targets.wheel]
packages = ["bluz_cli"]

[tool.hatch.version]
path = "bluz_cli/__init__.py"
