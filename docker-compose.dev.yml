services:
  ui:
    build:
      target: deps
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      # Force Next.js to use polling for hot-reloading across Windows file boundaries
      - WATCHPACK_POLLING=true
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
      