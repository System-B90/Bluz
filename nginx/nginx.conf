events {
    worker_connections 1024;
}

http {
    # Don't advertise the nginx version in responses or on error pages.
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # The 1 MB default silently 413s curriculum imports and large Excel/ICS
    # payloads.
    client_max_body_size 25m;

    # Resolve upstreams per request through Docker's embedded DNS. An
    # `upstream` block (or a literal proxy_pass) is resolved once at startup
    # and cached forever, so a redeployed ui/sessions container gets a new
    # address and every request 502s until the proxy itself is restarted.
    # A variable proxy_pass honours the TTL instead, so the proxy recovers.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Rate limiting, keyed on client address.
    #
    # `bluz_api` is sized for interactive use: a calendar drag-and-drop burst
    # fires a handful of writes back to back, and a page load fans out to
    # several endpoints at once, so the burst allowance matters more than the
    # sustained rate. A client stuck in a retry loop exceeds both.
    #
    # `bluz_api_heavy` covers endpoints that hold a DB connection for seconds
    # (curriculum cut, Excel/ICS export, Hive sync). These are user-initiated
    # one-at-a-time actions, so a much tighter budget is invisible in normal
    # use but stops a loop from saturating the pools.
    limit_req_zone $binary_remote_addr zone=bluz_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=bluz_api_heavy:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_status 429;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # SSL Certificate Paths (Must match volume mounts in docker-compose)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Standard SSL Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        # Forward-secrecy AEAD suites only. TLS 1.3 suites are not configurable
        # here and are negotiated independently.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        #
        # NOTE: `add_header` does not inherit into a `location` that declares
        # its own — any location adding a header must repeat this whole block.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CSP. 'unsafe-inline' is required in both directions and cannot be
        # dropped without app changes: Emotion injects MUI styles as inline
        # <style> tags, and Next.js emits an inline bootstrap script. 'self'
        # on connect-src covers the /ws/ upgrade, which is same-origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Next.js Frontend Routing
        location / {
            # $request_uri is required: a variable proxy_pass does not pass the
            # original URI on by itself.
            set $bluz_frontend bluz-ui:3000;
            proxy_pass http://$bluz_frontend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        # Container healthcheck and load balancer probe — never throttled, or a
        # flood would take the container down with it.
        location = /api/health {
            set $bluz_health bluz-ui:3000;
            proxy_pass http://$bluz_health$request_uri;
            include /etc/nginx/proxy_params.conf;
            access_log off;
        }

        # Expensive endpoints, matched before the general /api/ tier.
        location ~ ^/api/(gantt/curriculums/[^/]+/(cut|export)|event/export|iterations/[^/]+/sync-hive) {
            limit_req zone=bluz_api_heavy burst=5 nodelay;
            set $bluz_api_heavy_up bluz-ui:3000;
            proxy_pass http://$bluz_api_heavy_up$request_uri;
            include /etc/nginx/proxy_params.conf;

            # These legitimately run for a while; don't let the proxy cut them.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            limit_req zone=bluz_api burst=40 nodelay;
            set $bluz_api_up bluz-ui:3000;
            proxy_pass http://$bluz_api_up$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        # WebSocket Server Routing
        location /ws/ {
            set $bluz_websocket bluz-sessions:28199;
            proxy_pass http://$bluz_websocket$request_uri;
            proxy_http_version 1.1;

            # Required headers to establish and maintain WebSocket connections
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent NGINX from closing long-lived, idle connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
